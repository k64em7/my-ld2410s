[package]
name = "my-ld2410s"
version = "0.0.1"
edition = "2024"
description = "A simple library for ld2410s with tokio runtime"
license = "MIT OR Apache-2.0"

[dependencies]
flume = { version = "0.12.0", features = ["async"] }
futures = "0.3"
log = "0.4"
tokio = { version = "1.53.1", features = ["full"] }
zerocopy = "0.8"
zerocopy-derive = "0.8"
ringbuffer = { version = "0.16", default-features = false }

[dev-dependencies]
tokio-serial = "5.5.0"

[profile.release]
opt-level = "s"
lto = true
strip = true  
